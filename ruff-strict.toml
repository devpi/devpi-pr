[lint]
future-annotations = true
select = ["ALL"]
ignore = [
    "ANN", # maybe cleanup later - annotations
    "C408", # ignore - dict call
    "COM812", # ignore - ruff format
    "CPY001", # ignore - missing copyright notice
    "D", # ignore - docstrings
    "E501", # ignore - line too long
    "N", # ignore - naming
    "PLC0415", # ignore - import at top-level of file
    "PLR0913", # ignore - too many arguments
    "PLR0917", # ignore - too many positional arguments
    "PLR2004", # ignore - magic value comparison
    "PTH", # ignore - pathlib
    "Q", # ignore - quotes style
    "TD", # ignore - todos
]

pyupgrade.keep-runtime-typing = true


[lint.flake8-type-checking]
strict = true


[lint.isort]
case-sensitive = true
force-single-line = true
from-first = true
lines-after-imports = 2
no-sections = true
order-by-type = false


[lint.per-file-ignores]
"setup.py" = [
    "SIM115", # use a context manager for opening files
]
"src/devpi_pr/tests/conftest*.py" = [
    "INP001", # ignore - implicit namespace package
    "S101", # ignore - asserts
    "S603", # ignore - subprocess untrusted input
]
"src/devpi_pr/tests/test_*.py" = [
    "INP001", # ignore - implicit namespace package
    "S101", # ignore - asserts
]
